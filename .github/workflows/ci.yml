name: CI

on:
  push:
    branches: [main, "min/**", "rishi/**", "vidush/**", "sarthak/**", "nandit/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      # The dataset is not committed, so data-dependent tests are skipped in CI.
      # Baseline reproduction is a local, manually recorded step (see KI-002).
      - name: Test
        run: pytest -q -m "not requires_data"

  starter-kit-unmodified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if organizer reference code was modified
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then echo "not a PR, skipping"; exit 0; fi
          if git diff --name-only "$BASE" HEAD -- starter_kit/ \
             | grep -v '^starter_kit/PRESERVED.md$' | grep -q .; then
            echo "::error::starter_kit/ is organizer reference code and must not be modified."
            git diff --name-only "$BASE" HEAD -- starter_kit/
            exit 1
          fi
          echo "starter_kit/ untouched."
